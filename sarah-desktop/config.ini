[home_assistant]
; Adresse de Home Assistant vue depuis le PC
; (NAT : redirection 8080 -> 80 ; mode pont : relais scripts/relais-localhost.py)
url = http://127.0.0.1:8080
; Vide = assistant vocal préféré de Home Assistant
pipeline_id =

[sarah]
image = visage.jpg
; Mots qui réveillent Sarah (séparés par des virgules)
mots_reveil = sarah, sara
; Raccourci clavier pour appeler Sarah quand la musique couvre la voix (ctrl/alt/maj + espace, s ou pause)
raccourci = ctrl+espace
; Vide = micro par défaut de Windows (sinon une partie de son nom, ex. Scarlett)
micro = Intel MME

[sortie]
; Où Sarah parle : pc (enceintes du PC) ou homepod
appareil = pc
; Nom du HomePod tel qu'il apparaît dans l'app Maison
homepod = HomePod Blue
; Retard AirPlay estimé en ms (utilisé seulement si le micro n'entend pas le HomePod démarrer)
latence_ms = 1500
; Synchroniser le visage sur le moment où le micro entend la voix sortir du HomePod
synchro_micro = oui

[musique]
; Lecteur Spotify dans Home Assistant et nom de l'appareil Spotify du PC
lecteur = media_player.ma_chambre_spotify_toosie
appareil = JORIS
; Volume de la musique (%) pendant que Sarah écoute et parle
volume_pendant_sarah = 20
